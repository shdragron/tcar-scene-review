<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tcar 검토</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --line: #2a2f38; --text: #e6e8ec; --muted: #8a93a3;
          --del: #e8743b; --rep: #4ade80; --blue: #4ea1ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
               font: 13px/1.45 system-ui, 'Malgun Gothic', sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; }
  .mono { font-family: ui-monospace, Consolas, monospace; }
  .muted { color: var(--muted); }
  .del { color: var(--del); } .rep { color: var(--rep); }
  button, select { background: #222733; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                   padding: 4px 10px; cursor: pointer; font: inherit; }
  button:hover, select:hover { border-color: #4b5361; }
  button[hidden] { display: none; }
  button.primary { background: #16324f; border-color: var(--blue); color: #cfe4ff; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  #title { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .chip { padding: 0 8px; border-radius: 10px; border: 1px solid currentColor; font-size: 12px; white-space: nowrap; }
  .chip.prop { border-style: dashed; }
  #slider { flex: 1; min-width: 80px; }
  #autoLab { display: flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; color: var(--muted); }
  #autoLab:has(input:checked) { color: var(--blue); }
  #full { color: var(--muted); font-size: 12px; text-decoration: none; white-space: nowrap; }
  #full:hover { color: var(--text); }
  main { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 0; }
  /* left: review summary + scene list (kept scene with its deletion proposals as branches) */
  #list { overflow: auto; border-right: 1px solid var(--line); padding: 4px 0 12px; }
  #sum { margin: 6px 10px 4px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  #sum .line { display: flex; justify-content: space-between; gap: 6px; }
  #sum .big { font-size: 15px; font-weight: 600; }
  #sum .bar { height: 5px; margin: 6px 0 2px; border-radius: 3px; background: #2a2f38; overflow: hidden; }
  #sum .bar i { display: block; height: 100%; background: var(--blue); }
  #sum .go { width: 100%; margin-top: 8px; }
  #sum .tog { display: flex; gap: 4px; margin-top: 6px; }
  #sum .tog button { flex: 1; padding: 2px 0; font-size: 12px; }
  #sum .tog button.on { border-color: var(--blue); color: var(--blue); }
  #list .sec { padding: 10px 12px 4px; color: var(--muted); font-size: 12px; }
  #list .row { display: flex; gap: 8px; align-items: baseline; padding: 4px 12px; cursor: pointer; }
  #list .row:hover { background: #1c2029; }
  #list .row.cur { background: #1f2a3a; box-shadow: inset 3px 0 var(--blue); }
  #list .row b { font-family: ui-monospace, Consolas, monospace; }
  #list .row .kind { flex: 1; color: var(--muted); }
  #list .row.child { padding-left: 14px; }
  #list .row .br { color: #4b5361; font-family: ui-monospace, Consolas, monospace; }
  #list .row .gp { padding: 0 7px; font-size: 11px; line-height: 18px; }
  .st { font-size: 12px; white-space: nowrap; }
  .st.prop { color: var(--del); border: 1px dashed var(--del); border-radius: 8px; padding: 0 5px; }
  .st.drop { color: var(--del); }
  .st.keep { color: var(--rep); }
  .st.rule { color: #7fb894; }
  /* main view */
  #view { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; padding: 8px; min-height: 0; }
  #banner { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 8px;
            background: #2b1b12; border: 1px solid #5c3019; }
  #banner.rep { background: #11261a; border-color: #1f4d2e; }
  #banner[hidden] { display: none; }
  #bannerText { flex: 1; }
  #grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px; min-height: 0; }
  #left { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; min-height: 0; }
  #cams { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  #cams figure { position: relative; margin: 0; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; }
  #cams img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #cams figcaption { position: absolute; left: 6px; top: 4px; padding: 0 6px; border-radius: 4px; font-size: 11px;
                     background: rgba(0, 0, 0, .55); }
  canvas { display: block; width: 100%; background: #0a0c10; border-radius: 6px; }
  #map { height: 100%; min-height: 120px; }
  #right { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 6px; min-height: 0; }
  #lidar { height: 100%; cursor: grab; }
  #lidar:active { cursor: grabbing; }
  #stat, #lidarNote { color: var(--muted); font-size: 12px; }
  /* review: the kept scene and its deletion proposals, side by side, decided per scene */
  #rev { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 8px;
         padding: 12px; background: #08090c; }
  #rev[hidden] { display: none; }
  #rev .bar { display: flex; align-items: center; gap: 10px; }
  #revTitle { font-size: 15px; font-weight: 600; white-space: nowrap; }
  #revSlider { flex: 1; min-width: 80px; }
  #revTiles { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 10px; min-height: 0; }
  #revTiles figure { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-height: 0;
                     padding: 6px; border: 2px solid transparent; border-radius: 8px; }
  #revTiles figure.drop { border-color: rgba(232, 116, 59, .55); }
  #revTiles figure.keep { border-color: rgba(74, 222, 128, .45); }
  #revTiles figcaption { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  #revTiles figcaption .sp { flex: 1; }
  #revTiles img { width: 100%; height: 100%; object-fit: contain; background: #000; border-radius: 6px; min-height: 0; }
  #revTiles .body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-height: 0; }
  #revTiles .body.both { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #revTiles .body canvas { height: 100%; min-height: 0; cursor: grab; }
  #revTiles .body.cam canvas, #revTiles .body.lid img { display: none; }
  .dec { display: flex; gap: 4px; }
  .dec button { padding: 3px 14px; font-weight: 600; }
  .dec button.on.keep { background: #173d26; border-color: var(--rep); color: var(--rep); }
  .dec button.on.drop { background: #3d2012; border-color: var(--del); color: var(--del); }
  .dec button.on.auto { background: transparent; border-style: dashed; }
  #revFoot { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
  #revFoot .sp { flex: 1; }
  #revDone { color: var(--rep); font-weight: 600; }
  button.danger { background: #3a1a10; border-color: var(--del); color: #ffc9b0; }
  button:disabled { opacity: .5; cursor: default; }
  /* 삭제 확정: plan first, then run */
  #apply { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 6, 8, .82); }
  #apply[hidden] { display: none; }
  #apply .box { width: min(660px, calc(100vw - 32px)); max-height: 80vh; overflow: auto; padding: 16px 18px;
                background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #apply h3 { margin: 0 0 10px; font-size: 16px; }
  #apply .row { margin: 7px 0; }
  #apply .warn { color: #ffb86b; }
  #apply .names { margin-top: 3px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
  #apply .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <span id="title">…</span><span class="chip" id="chip"></span>
  <button id="prevScene" title="이전 scene (↑)">◀</button><button id="nextScene" title="다음 scene (↓)">▶</button>
  <button id="play" title="재생 / 멈춤 (Space)">▶ 재생</button>
  <select id="speed" title="배속"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  <label id="autoLab" title="scene이 끝나면 왼쪽 목록의 다음 scene을 이어서 재생, 마지막 다음에는 처음부터"><input type="checkbox" id="autoNext"> 이어서 재생</label>
  <input type="range" id="slider" min="0" max="39" value="0" title="프레임 (← →)">
  <span id="time" class="mono">0.0 s</span>
  <a id="full" href="/full" title="이전의 자세한 뷰어 (분포, 위험, 라벨 등)">자세히 보기 ↗</a>
</header>
<main>
  <nav id="list"></nav>
  <section id="view">
    <div id="banner" hidden><span id="bannerText"></span><button id="bannerBtn" class="primary"></button></div>
    <div id="grid">
      <div id="left">
        <div id="cams"></div>
        <canvas id="map"></canvas>
        <div id="stat"></div>
      </div>
      <div id="right">
        <canvas id="lidar"></canvas>
        <div id="lidarNote">LiDAR 3D · 드래그 = 회전 · 오른쪽 드래그 = 이동 · 휠 = 확대/축소 · 더블클릭 = 처음 시점 · 원 간격 10 m · 색 = 높이</div>
      </div>
    </div>
  </section>
</main>

<div id="rev" hidden>
  <div class="bar">
    <span id="revTitle"></span>
    <button id="revPrev" title="이전 그룹 (←)">◀ 이전</button><button id="revNext" title="다음 그룹 (→)">다음 ▶</button>
    <button id="revPlay" title="재생 / 멈춤 (Space)">▶ 재생</button>
    <select id="revSpeed" title="배속"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
    <input type="range" id="revSlider" min="0" max="20" step="0.1" value="0">
    <span id="revTime" class="mono">0.0 s</span>
    <select id="revCam" title="카메라"></select>
    <button id="revClose">닫기 (Esc)</button>
  </div>
  <div id="revReason" class="muted"></div>
  <div id="revTiles"></div>
  <div id="revFoot">
    <span>scene마다 <b>남기기 / 버리기</b>를 누르면 바로 저장됩니다 · 점선 = 아직 규칙 제안 그대로 · 같은 버튼을 다시 누르면 취소</span>
    <span class="sp"></span><span id="revDone"></span>
    <button id="revAccept" class="primary" title="아직 정하지 않은 scene을 규칙 제안대로 확정하고 다음 그룹으로 (A)">규칙대로 확정 → 다음</button>
  </div>
</div>

<div id="apply" hidden>
  <div class="box">
    <h3>삭제 확정</h3>
    <div id="applyBody"></div>
    <div class="acts"><button id="applyCancel">취소</button><button id="applyRun" class="danger">실행 (되돌리기 가능)</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CAMS = ['CAM_FRONT_LEFT', 'CAM_FRONT', 'CAM_FRONT_RIGHT', 'CAM_BACK_LEFT', 'CAM_BACK', 'CAM_BACK_RIGHT'];
const CAM_KO = { CAM_FRONT_LEFT: '앞 왼쪽', CAM_FRONT: '앞', CAM_FRONT_RIGHT: '앞 오른쪽',
                 CAM_BACK_LEFT: '뒤 왼쪽', CAM_BACK: '뒤', CAM_BACK_RIGHT: '뒤 오른쪽' };
const short = n => n.slice(-4);
const routeOf = log => log.split('_')[0];

let scenes = [], byName = {}, sel = null, human = {}, order = [], cur = { si: -1, i: 0 }, req = 0;
let groupOf = {}, bounds = null, lastEgo = null, listView = 'all';
try { listView = localStorage.getItem('simple.view') || 'all'; } catch (e) {}

// ---------- data ----------
async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status + ' ' + u); return r.json(); }
const cache = new Map();
function cached(u) {   // small LRU for sample JSON
  if (cache.has(u)) { const p = cache.get(u); cache.delete(u); cache.set(u, p); return p; }
  const p = getJSON(u);
  cache.set(u, p);
  if (cache.size > 60) cache.delete(cache.keys().next().value);
  p.catch(() => cache.delete(u));
  return p;
}
const S = n => (sel && !sel.missing && sel.scenes && sel.scenes[n]) || {};
const diffOf = n => S(n).lidar_cells == null ? '?' : S(n).lidar_cells.toFixed(0);

// ---------- decisions: the rule only proposes, a person decides; final = person's choice, else the proposal ----------
const ruleDrop = n => S(n).status === 'remove';
const humanOf = n => (human[n] && human[n].decision) || null;               // 'keep' | 'drop' | null
const finalDrop = n => (humanOf(n) || (ruleDrop(n) ? 'drop' : 'keep')) === 'drop';
const childrenOf = p => Object.keys((sel && sel.scenes) || {}).filter(m => ruleDrop(m) && S(m).substitute === p)
  .sort((a, b) => (S(b).lidar_cells || 0) - (S(a).lidar_cells || 0));
const isRuleRep = n => !ruleDrop(n) && childrenOf(n).length > 0;
let GROUPS = [];                                  // review items: [kept scene, ...its deletion proposals]
function buildGroups() {
  const parents = [];
  for (const s of scenes) {
    const n = s.name;
    if (ruleDrop(n)) { const p = S(n).substitute || n; if (!parents.includes(p)) parents.push(p); }
  }
  parents.sort((a, b) => order.indexOf(byName[a]) - order.indexOf(byName[b]));
  GROUPS = parents.map(p => ruleDrop(p) ? [p] : [p, ...childrenOf(p)]);
}
const groupDone = g => g.every(n => humanOf(n));
const groupIndexOf = n => GROUPS.findIndex(g => g.includes(n));
function tag(n) {   // one short status per scene: the proposal until a person decides
  const h = humanOf(n);
  if (h === 'drop') return '<span class="st drop">버림 ✓</span>';
  if (h === 'keep') return `<span class="st keep">남김 ✓</span>`;
  if (ruleDrop(n)) return `<span class="st prop">삭제 제안</span>`;
  if (isRuleRep(n)) return `<span class="st rule">남김 (규칙)</span>`;
  return '';
}
async function decide(n, v, via = 'manual') {   // v: 'keep' | 'drop' | null (back to the proposal); logged in decisions_log.txt
  const r = await fetch('/api/decisions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ scene: n, decision: v, via }) });
  if (!r.ok) { alertLine('저장 실패: HTTP ' + r.status); return; }
  human = (await r.json()).decisions || {};
  refreshStatus();
}
function alertLine(t) { $('revDone').textContent = t; $('stat').textContent = t; }
function refreshStatus() {
  buildList();
  if (cur.si >= 0) { header(scenes[cur.si]); banner(scenes[cur.si]); }
  if (!$('rev').hidden) renderReviewState();
}

// ---------- left: summary + list ----------
const pct = (a, b) => a ? `−${((1 - b / a) * 100).toFixed(1)}%` : '';
const gb = v => (v / 1e9).toFixed(1) + ' GB';
const sumBytes = ns => ns.reduce((a, n) => a + (S(n).bytes || 0), 0);
function buildList() {
  const logs = [], routeOrder = sel && sel.routes ? sel.routes.map(r => r.log) : [];
  for (const s of scenes) if (!logs.includes(s.log)) logs.push(s.log);
  logs.sort((a, b) => (routeOrder.indexOf(a) + 1 || 99) - (routeOrder.indexOf(b) + 1 || 99));
  const all = scenes.map(s => s.name), kept = all.filter(n => !finalDrop(n));
  const done = GROUPS.filter(groupDone).length, props = all.filter(ruleDrop).length, decided = Object.keys(human).length;
  const next = GROUPS.findIndex(g => !groupDone(g));
  let html = `<div id="sum">`
    + `<div class="line"><span>검토 <b>${done} / ${GROUPS.length}</b> 그룹</span><span class="muted">결정 ${decided}개</span></div>`
    + `<div class="bar"><i style="width:${GROUPS.length ? done / GROUPS.length * 100 : 100}%"></i></div>`
    + `<div class="line big"><span>최종 삭제 ${all.length - kept.length} / ${all.length}</span><span class="del">${pct(all.length, kept.length)}</span></div>`
    + `<div class="line muted"><span>용량 ${gb(sumBytes(all))} → ${gb(sumBytes(kept))}</span><span>${pct(sumBytes(all), sumBytes(kept))}</span></div>`
    + `<div class="muted">규칙 제안 삭제 ${props}개${decided ? ' · 사람 결정 반영' : ' · 아직 사람 결정 없음'}</div>`
    + (GROUPS.length ? `<button class="go primary" data-review="${next >= 0 ? next : 0}">${next >= 0 ? `▶ 검토 ${done ? '이어서' : '시작'} (남은 ${GROUPS.length - done} 그룹)` : '✓ 검토 완료 · 다시 보기'}</button>` : '')
    + (all.length > kept.length ? `<button class="go danger" data-apply="1" title="최종 삭제 목록대로 데이터에서 scene을 빼고 이름을 당깁니다. 누르면 먼저 계획을 보여줍니다">삭제 확정 · ${all.length - kept.length}개 빼기</button>` : '')
    + `<div class="tog"><button data-view="all"${listView === 'all' ? ' class="on"' : ''}>전체</button>`
    + `<button data-view="del"${listView === 'del' ? ' class="on"' : ''}>검토 대상만</button></div></div>`;
  order = [];
  const row = (i, extra = '', br = '') => {
    const n = scenes[i].name, kind = (S(n).group_label || '').split(' · ').pop();
    order.push(i);
    return `<div class="row${br ? ' child' : ''}${i === cur.si ? ' cur' : ''}" data-i="${i}">${br ? `<span class="br">${br}</span>` : ''}`
      + `<b>${short(n)}</b><span class="kind">${kind}</span>${tag(n)}${extra}</div>`;
  };
  for (const lg of logs) {
    const idx = scenes.map((s, i) => i).filter(i => scenes[i].log === lg);
    const names = idx.map(i => scenes[i].name), nd = names.filter(finalDrop).length, np = names.filter(ruleDrop).length;
    if (listView === 'del' && !np && !nd) continue;
    const keptR = names.filter(n => !finalDrop(n));
    html += `<div class="sec">${routeOf(lg)} · ${idx.length}개`
      + (nd ? ` · 삭제 ${nd} <span class="del">${pct(names.length, keptR.length)}</span> · ${gb(sumBytes(names))} → ${gb(sumBytes(keptR))}` : '')
      + '</div>';
    for (const i of idx) {
      const n = scenes[i].name, kids = childrenOf(n);
      if (ruleDrop(n) && byName[S(n).substitute] !== undefined && scenes[byName[S(n).substitute]].log === lg) continue;   // under its kept scene
      if (listView === 'del' && !kids.length && !ruleDrop(n) && !humanOf(n)) continue;
      const gi = groupIndexOf(n);
      html += row(i, gi >= 0 ? `<button class="gp" data-review="${gi}" title="이 그룹 검토: 나란히 재생하며 남기기 / 버리기">검토</button>` : '');
      kids.forEach((c, k) => { html += row(byName[c], '', k === kids.length - 1 ? '└' : '├'); });
    }
  }
  $('list').innerHTML = html;
}
$('list').onclick = e => {
  const v = e.target.closest('[data-view]');
  if (v) { listView = v.dataset.view; try { localStorage.setItem('simple.view', listView); } catch (err) {} return buildList(); }
  const g = e.target.closest('[data-review]');
  if (g) return openReview(+g.dataset.review);
  if (e.target.closest('[data-apply]')) return openApply();
  const r = e.target.closest('.row');
  if (r) go(+r.dataset.i, 0);
};

// ---------- header + reason line ----------
function header(sc) {
  $('title').textContent = `${sc.name} · ${routeOf(sc.log)}`;
  const n = sc.name, h = humanOf(n), chip = $('chip');
  chip.textContent = h === 'drop' ? '버림 ✓' : h === 'keep' ? '남김 ✓' : ruleDrop(n) ? '삭제 제안' : isRuleRep(n) ? '남김 (규칙)' : '유지';
  chip.className = 'chip ' + (h === 'drop' ? 'del' : h === 'keep' ? 'rep' : ruleDrop(n) ? 'del prop' : isRuleRep(n) ? 'rep prop' : 'muted');
  document.querySelectorAll('#list .row').forEach(r => r.classList.toggle('cur', +r.dataset.i === cur.si));
  const row = document.querySelector('#list .row.cur');
  if (row) row.scrollIntoView({ block: 'nearest' });
}
function ruleText(g) {   // why the rule proposes what it proposes, for one review group
  const p = g[0], grp = groupOf[p] || g;
  if (g.length === 1) return `규칙: 삭제 제안 · ${S(p).summary || ''}`;
  const ranking = g.map(m => `${short(m)} ${diffOf(m)}`).join(' > ');
  return sel.mode === 'stops'
    ? `규칙: 같은 장소에 멈춘 scene [${grp.map(short).join(', ')}] 중 LiDAR diff가 가장 큰 ${short(p)}만 남기고 ${g.length - 1}개 삭제 제안 · diff ${ranking}`
    : `규칙: ${S(g[1]).summary || ''}`;
}
function banner(sc) {

  gi = ((gi % GROUPS.length) + GROUPS.length) % GROUPS.length;
  if (PLAY.on) stopPlay();
  if (REV.on) revToggle();
  REV.gi = gi; REV.names = GROUPS[gi]; REV.t = t;
  const N = REV.names.length, cols = N <= 2 ? N : N <= 4 ? 2 : Math.ceil(Math.sqrt(N));   // 2x2 keeps 16:9 frames large
  $('revTiles').style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
  const num = k => '①②③④⑤⑥⑦⑧⑨'[k] || k + 1;
  $('revTiles').innerHTML = REV.names.map((n, k) => `<figure data-n="${n}"><figcaption>`
    + `<b>${num(k)} ${n}</b><span class="rule-lab"></span><span class="muted">diff ${diffOf(n)}</span><span class="sp"></span>`
    + `<span class="dec"><button data-dec="keep" data-n="${n}">남기기</button><button data-dec="drop" data-n="${n}">버리기</button></span>`
    + `</figcaption><div class="body"><img alt=""><canvas title="드래그 = 회전 · 오른쪽 드래그 = 이동 · 휠 = 확대 · 더블클릭 = 처음 시점 (모든 칸 같이)"></canvas></div></figure>`).join('');
  REV.imgs = [...$('revTiles').querySelectorAll('img')];
  const redrawAll = () => REV.lids.forEach(l => l.schedule());
  REV.lids = [...$('revTiles').querySelectorAll('canvas')].map(cv => makeLidarView(cv, RVIEW, redrawAll, N > 2 ? 2 : 1));
  REV.lidBusy = REV.names.map(() => false);
  applyRevMode();
  $('revReason').textContent = ruleText(REV.names);
  $('rev').hidden = false;
  renderReviewState();
  revShow();
  if (autoplay) revToggle();
}
function renderReviewState() {
  const done = GROUPS.filter(groupDone).length;
  $('revTitle').textContent = `검토 ${REV.gi + 1} / ${GROUPS.length} · 완료 ${done}`;
  $('revTiles').querySelectorAll('figure').forEach(f => {
    const n = f.dataset.n, h = humanOf(n), fin = finalDrop(n) ? 'drop' : 'keep';
    f.className = h ? fin : '';
    f.querySelector('.rule-lab').innerHTML = ruleDrop(n) ? ' · <span class="del">규칙: 삭제 제안</span>' : ' · <span class="rep">규칙: 남김</span>';
    f.querySelectorAll('.dec button').forEach(b => {
      const on = b.dataset.dec === fin;
      b.className = on ? `on ${fin}${h ? '' : ' auto'}` : '';
      b.title = on && !h ? '규칙 제안 (아직 사람이 정하지 않음)' : on ? '사람이 정함 · 다시 누르면 취소' : '';
    });
  });
  const g = GROUPS[REV.gi];
  $('revDone').textContent = g && groupDone(g) ? '✓ 이 그룹 결정 완료' : '';
}
$('revTiles').addEventListener('click', e => {
  const b = e.target.closest('[data-dec]');
  if (!b) return;
  const n = b.dataset.n, v = b.dataset.dec;
  decide(n, humanOf(n) === v ? null : v);         // same button again = back to the rule's proposal
});
async function acceptRule() {   // undecided members take the rule's proposal, then the next open group
  for (const n of REV.names) if (!humanOf(n)) await decide(n, ruleDrop(n) ? 'drop' : 'keep', 'rule');
  const next = GROUPS.findIndex((g, k) => k > REV.gi && !groupDone(g));
  const any = next >= 0 ? next : GROUPS.findIndex(g => !groupDone(g));
  if (any >= 0 && any !== REV.gi) openReview(any);
  else renderReviewState();
}
async function revShow() {   // camera tiles load + decode first, then change together; LiDAR follows on its own
  const my = ++REV.req, m = revMode(), cam = m.cam, t = REV.t;
  $('revSlider').value = t; $('revTime').textContent = t.toFixed(1) + ' s';
  if (m.lid) REV.names.forEach((n, k) => revLidar(k, n, t));
  if (!cam) return;
  const lists = await Promise.all(REV.names.map(n => framesOf(n, cam).catch(() => null)));
  if (my !== REV.req) return;
  const fns = lists.map((fr, k) => fr && pick(fr, scenes[byName[REV.names[k]]].sample_ts[0], t));
  const ims = await Promise.all(fns.map((fn, k) => fn && REV.imgs[k].dataset.fn !== fn ? loadImg(fn) : null));
  if (my !== REV.req) return;
  ims.forEach((im, k) => { if (im) { im.dataset.fn = fns[k]; REV.imgs[k].replaceWith(im); REV.imgs[k] = im; } });
}
function revToggle() {   // real time: the next frame is whatever time it is once the previous one is shown
  if (REV.on) { REV.on = false; $('revPlay').textContent = '▶ 재생'; return; }
  if (REV.t >= 20) REV.t = 0;
  REV.on = true; REV.base = REV.t; REV.start = performance.now();
  $('revPlay').textContent = '❚❚ 멈춤';
  requestAnimationFrame(revTick);
}
async function revTick() {
  if (!REV.on) return;
  REV.t = Math.min(20, REV.base + (performance.now() - REV.start) / 1000 * speedOf());
  await revShow();
  if (REV.t >= 20) { REV.t = 0; REV.base = 0; REV.start = performance.now(); }   // loop the group until decided
  requestAnimationFrame(revTick);
}
function closeReview() {
  if (REV.on) revToggle();
  $('rev').hidden = true;
  const n = REV.names[0];
  if (n !== undefined && byName[n] !== undefined && byName[n] !== cur.si) go(byName[n], 0);
}
$('revPlay').onclick = revToggle;
$('revClose').onclick = closeReview;
$('revPrev').onclick = () => openReview(REV.gi - 1);
$('revNext').onclick = () => openReview(REV.gi + 1);
$('revAccept').onclick = acceptRule;
$('revSlider').oninput = () => { REV.t = +$('revSlider').value; REV.base = REV.t; REV.start = performance.now(); revShow(); };
$('revCam').onchange = () => {
  try { localStorage.setItem('simple.revView', $('revCam').value); } catch (e) {}
  applyRevMode(); revShow();
};

// ---------- 삭제 확정: show the plan, then move the deleted scenes out and renumber (server: tools/apply_selection.py) ----------
async function openApply() {
  if (PLAY.on) stopPlay();
  $('apply').hidden = false;
  $('applyRun').hidden = false; $('applyRun').disabled = true;
  $('applyCancel').disabled = false; $('applyCancel').textContent = '취소';
  $('applyCancel').onclick = () => { $('apply').hidden = true; };
  $('applyBody').textContent = '계획 불러오는 중…';
  let p;
  try { p = await getJSON('/api/apply/plan'); } catch (e) { $('applyBody').textContent = '계획을 불러오지 못함: ' + e.message; return; }
  if (p.error) { $('applyBody').textContent = p.error; return; }
  const rule = p.deleted.filter(n => p.by[n] !== 'human'), ren = Object.entries(p.rename);
  $('applyBody').innerHTML =
    `<div class="row"><b>scene ${p.n_before} → ${p.n_after}</b> · ${p.deleted.length}개를 데이터에서 뺍니다 (${(p.bytes_moved / 1e9).toFixed(1)} GB)</div>`
    + `<div class="row">빼는 scene: ${p.deleted.map(n => `<b class="mono">${short(n)}</b> ${p.by[n] === 'human'
        ? '<span class="muted">(사람 결정)</span>' : '<span class="del">(규칙 제안)</span>'}`).join(' · ')}</div>`
    + (rule.length ? `<div class="row warn">⚠ 아직 사람이 보지 않은 규칙 제안 ${rule.length}개(${rule.map(short).join(', ')})도 그대로 빠집니다. 먼저 검토하는 것을 권장합니다.</div>` : '')
    + `<div class="row">이름 당김 ${ren.length}개 (빈 번호 없이 앞으로 채움)<div class="names">${ren.map(([a, b]) => `${short(a)}→${short(b)}`).join('  ') || '없음'}</div></div>`
    + `<div class="row muted">지우지 않고 <span class="mono">_removed/&lt;시각&gt;/</span> 폴더로 옮기고, 원래 표와 이름 대응표를 같이 저장해 되돌릴 수 있습니다. `
    + `남는 scene에 대한 결정(예: 남기기)은 새 이름으로 따라가고, 규칙은 새 데이터로 다시 돌립니다. 모든 결정은 decisions_log.txt에 남습니다.</div>`;
  $('applyRun').disabled = false;
}
async function runApply() {
  $('applyRun').disabled = true; $('applyCancel').disabled = true;
  $('applyBody').textContent = '적용 중… (파일 이동 · 이름 변경 · 규칙 다시 실행)';
  let r;
  try {
    const res = await fetch('/api/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ confirm: true }) });
    r = res.ok ? await res.json() : { ok: false, error: 'HTTP ' + res.status };
  } catch (e) { r = { ok: false, error: e.message }; }
  $('applyCancel').disabled = false;
  if (!r.ok) {
    $('applyBody').innerHTML = `<div class="row warn">실패: ${esc(r.error || '')}</div><div class="row muted">${esc(r.hint || '')}</div>`;
    return;
  }
  $('applyBody').innerHTML = `<div class="row"><b>완료</b> · 이제 scene ${r.n_after}개 · ${r.deleted.length}개를 백업으로 옮김</div>`
    + `<div class="row muted">백업: <span class="mono">${esc(r.backup)}</span></div>`
    + `<div class="row muted">되돌리기: <span class="mono">${esc(r.undo)}</span></div>`
    + (r.curate_ok ? '' : '<div class="row warn">규칙 재실행 실패 — python tools/curate.py 를 직접 실행하세요</div>');
  $('applyRun').hidden = true;
  $('applyCancel').textContent = '새로고침';
  $('applyCancel').onclick = () => { history.replaceState(null, '', '/'); location.reload(); };
}
$('applyRun').onclick = runApply;

// ---------- keys ----------
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (!$('apply').hidden) { if (e.key === 'Escape' && !$('applyCancel').disabled) $('applyCancel').click(); return; }
  if (!$('rev').hidden) {
    if (e.key === 'Escape') closeReview();
    else if (e.key === ' ') { e.preventDefault(); revToggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); openReview(REV.gi + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); openReview(REV.gi - 1); }
    else if (e.key === 'a' || e.key === 'A') acceptRule();
    return;
  }
  if (e.target === $('slider') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;   // the slider moves itself
  if (e.key === 'ArrowRight') { e.preventDefault(); go(cur.si, cur.i + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur.si, cur.i - 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); stepScene(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); stepScene(-1); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});
let resizeT = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { drawMap(); lschedule(); }, 100);
});

// ---------- start ----------
async function init() {
  const [sc, se, hd] = await Promise.all([getJSON('/api/scenes'), getJSON('/api/selection').catch(() => ({ missing: true })),
                                          getJSON('/api/decisions').catch(() => ({ decisions: {} }))]);
  scenes = sc.scenes;
  scenes.forEach((s, i) => { byName[s.name] = i; });
  sel = se;
  human = hd.decisions || {};
  if (sel && !sel.missing) for (const r of sel.routes || []) for (const g of r.stage1_groups || []) for (const m of g) groupOf[m] = g;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('view') === 'del' || h.get('view') === 'all') listView = h.get('view');
  const saveView = listView;
  listView = 'all'; buildList();                   // scene order for the review groups
  buildGroups();
  listView = saveView; buildList();
  const si = byName[h.get('scene')] ?? order[0];
  await go(si, +h.get('i') || 0);
  if (h.get('play')) startPlay();
  if (h.get('review') !== null && h.get('review') !== undefined && GROUPS.length) openReview(+h.get('review') || 0, +h.get('t') || 0, h.get('pause') === null);
}
init().catch(e => { $('title').textContent = '초기화 실패: ' + e.message; });
</script>
</body>
